[project]
name = "ltspice-python-automation"
version = "0.1.0"
description = "Run LTspice simulations from Python and read the results in scripts and notebooks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Mateusz Wójcik" }]
keywords = ["ltspice", "spice", "simulation", "electronics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "PyLTSpice>=6,<7",
    "numpy>=2",
    "pandas>=2",
    "matplotlib>=3.8",
]

[project.scripts]
ltspice-run = "ltspice_automation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltspice_automation"]

[dependency-groups]
dev = ["pytest>=8"]
notebooks = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
